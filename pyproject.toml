[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "game-ui-mcp"
version = "0.13.0"
description = "Let your AI agent design, animate and export game, desktop (WPF/Avalonia/WinUI/Qt/ImGui) and web/React UI. Local MCP server, no image model."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "game-ui", "ui-design", "unity", "godot", "roblox", "unreal", "svg"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based",
]
dependencies = [
    "mcp>=1.2",
    "pillow>=10.1",
    "numpy>=1.24",
    "opencv-python-headless>=4.10",
    "uharfbuzz>=0.39",
    "pyclipper>=1.3",
]

[project.urls]
Homepage = "https://github.com/TENETTE/game-ui-mcp"
Issues = "https://github.com/TENETTE/game-ui-mcp/issues"

[project.optional-dependencies]
# NVIDIA GPUs (CUDA 12 fused kernels + WebGPU fallback)
gpu = ["cupy-cuda12x[ctk]>=13.4", "wgpu>=0.19"]
nvidia = ["cupy-cuda12x[ctk]>=13.4", "wgpu>=0.19"]
# Cross-vendor WebGPU compute shaders (shared runtime for AMD, Intel and Apple Silicon)
wgpu = ["wgpu>=0.19"]
amd = ["wgpu>=0.19"]
intel = ["wgpu>=0.19"]
apple = ["wgpu>=0.19"]
# CPU-only (zero GPU extras; deterministic OpenCV SIMD + NumPy)
cpu = []
# Optional local OCR for import_screenshot
ocr = ["rapidocr-onnxruntime>=1.3"]
# Optional MP4 / WebM export without a system ffmpeg
video = ["imageio-ffmpeg>=0.5"]
dev = ["pytest>=7"]

[project.scripts]
game-ui-mcp = "game_ui_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/game_ui_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
