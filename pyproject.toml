[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uiforge-mcp"
version = "0.17.0"
description = "Local deterministic UI design studio & MCP server (Human UI Mode, MCP Mode, Combined Mode). PBR materials, animations, game engines, .NET/C++ desktop & web/React."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
    "mcp",
    "model-context-protocol",
    "uiforge",
    "ui-design",
    "ui-studio",
    "pbr",
    "unreal",
    "unity",
    "godot",
    "roblox",
    "wpf",
    "qt",
    "svg",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "mcp>=1.2",
    "pillow>=10.1",
    "numpy>=1.24",
    "opencv-python-headless>=4.10",
    "uharfbuzz>=0.39",
    "pyclipper>=1.3",
]

[project.urls]
Homepage = "https://github.com/TENETTE/uiforge-mcp"
Repository = "https://github.com/TENETTE/uiforge-mcp"
Documentation = "https://github.com/TENETTE/uiforge-mcp#readme"
Changelog = "https://github.com/TENETTE/uiforge-mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/TENETTE/uiforge-mcp/issues"

[project.optional-dependencies]
# NVIDIA GPUs (CUDA 12 fused kernels + WebGPU fallback)
gpu = ["cupy-cuda12x[ctk]>=13.4", "wgpu>=0.19"]
nvidia = ["cupy-cuda12x[ctk]>=13.4", "wgpu>=0.19"]
# Cross-vendor WebGPU compute shaders (shared runtime for AMD, Intel and Apple Silicon)
wgpu = ["wgpu>=0.19"]
amd = ["wgpu>=0.19"]
intel = ["wgpu>=0.19"]
apple = ["wgpu>=0.19"]
# CPU-only (zero GPU extras; deterministic OpenCV SIMD + NumPy)
cpu = []
# Optional local OCR for import_screenshot
ocr = ["rapidocr-onnxruntime>=1.3"]
# Optional MP4 / WebM export without a system ffmpeg
video = ["imageio-ffmpeg>=0.5"]
# Optional native desktop window wrapper for Human Mode (`uiforge ui --app`)
desktop = ["pywebview>=5.0"]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
uiforge-mcp = "uiforge_mcp.server:main"
uiforge = "uiforge_mcp.cli:uiforge_main"

[tool.hatch.build.targets.wheel]
packages = ["src/uiforge_mcp"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/docs/*.png",
    "/examples/*.png",
    "/examples/*.gif",
    "/examples/*.svg",
    "/examples/*.psd",
    "/examples/out",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["F401", "F63", "F7", "F82"]
