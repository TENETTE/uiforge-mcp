[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uiforge-mcp"
version = "0.15.0"
description = "Local deterministic UI design studio & MCP server (MCP Mode, Human UI Mode, Combined Mode). PBR materials, animations, game engines, .NET/C++ desktop & web/React."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "uiforge", "ui-design", "ui-studio", "unity", "godot", "roblox", "unreal", "wpf", "qt", "svg"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based",
]
dependencies = [
    "mcp>=1.2",
    "pillow>=10.1",
    "numpy>=1.24",
    "opencv-python-headless>=4.10",
    "uharfbuzz>=0.39",
    "pyclipper>=1.3",
]

[project.urls]
Homepage = "https://github.com/TENETTE/uiforge-mcp"
Issues = "https://github.com/TENETTE/uiforge-mcp/issues"

[project.optional-dependencies]
# NVIDIA GPUs (CUDA 12 fused kernels + WebGPU fallback)
gpu = ["cupy-cuda12x[ctk]>=13.4", "wgpu>=0.19"]
nvidia = ["cupy-cuda12x[ctk]>=13.4", "wgpu>=0.19"]
# Cross-vendor WebGPU compute shaders (shared runtime for AMD, Intel and Apple Silicon)
wgpu = ["wgpu>=0.19"]
amd = ["wgpu>=0.19"]
intel = ["wgpu>=0.19"]
apple = ["wgpu>=0.19"]
# CPU-only (zero GPU extras; deterministic OpenCV SIMD + NumPy)
cpu = []
# Optional local OCR for import_screenshot
ocr = ["rapidocr-onnxruntime>=1.3"]
# Optional MP4 / WebM export without a system ffmpeg
video = ["imageio-ffmpeg>=0.5"]
# Optional native desktop window wrapper for Human Mode (`uiforge ui --app`)
desktop = ["pywebview>=5.0"]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
uiforge-mcp = "uiforge_mcp.server:main"
uiforge = "uiforge_mcp.cli:uiforge_main"

[tool.hatch.build.targets.wheel]
packages = ["src/uiforge_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
